<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo options</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --gold:#c0913b; --gold-l:#d9b464; --navy:#0e2a41; }
  * { box-sizing: border-box; }
  body { margin:0; background:#000; color:#fff; font-family:Poppins, sans-serif; }
  .opt { padding:28px 56px 40px; border-bottom:1px solid #222; }
  .opt h2 { font: 500 14px Poppins; color:#9aa4ad; margin:0 0 18px; }
  .bar { display:flex; align-items:center; gap:56px; height:116px; padding:0 32px; background:#000; border:1px solid #1d1d1d; border-radius:6px; }
  .photo { margin-top:14px; height:150px; border-radius:6px; padding:0 32px; display:flex; align-items:center;
           background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.15)), url(/assets/images/erg-chebbi-caravan-sunset.jpg) center 40%/cover; }
  .menu { display:flex; gap:28px; font: 500 15px Oswald; text-transform:uppercase; letter-spacing:.02em; }
  .small { margin-left:auto; display:flex; align-items:center; gap:16px; color:#666; font-size:12px; }
  svg text { font-family: Oswald, sans-serif; }
  .logo { height:68px; width:auto; display:block; }
  .logo--s { height:44px; }
</style>
</head>
<body>

<!-- ============ A: Arch & dune ============ -->
<section class="opt">
  <h2>A · Moorish arch with sun over a dune</h2>
  <div class="bar">
    <svg class="logo" viewBox="0 0 300 90" aria-label="Morocco Tours Hub">
      <g id="markA">
        <path d="M8 86 V40 A27 27 0 1 1 60 40 V86" fill="none" stroke="#c0913b" stroke-width="3.5"/>
        <circle cx="34" cy="52" r="9" fill="#c0913b"/>
        <path d="M9.75 70 Q22 58 36 66 T58.25 62 V84.25 H9.75 Z" fill="#fff"/>
      </g>
      <text x="80" y="52" font-size="42" font-weight="600" letter-spacing="5" fill="#fff">MOROCCO</text>
      <line x1="81" y1="68" x2="102" y2="68" stroke="#c0913b" stroke-width="1.5"/>
      <text x="110" y="74" font-size="16" font-weight="400" letter-spacing="10.6" fill="#d9b464">TOURS HUB</text>
    </svg>
    <nav class="menu"><span>Home</span><span>All Tours</span><span>Experiences</span></nav>
    <div class="small">phone size →
      <svg class="logo logo--s" viewBox="0 0 300 90"><use href="#markA"/>
        <text x="80" y="52" font-size="42" font-weight="600" letter-spacing="5" fill="#fff">MOROCCO</text>
        <line x1="81" y1="68" x2="102" y2="68" stroke="#c0913b" stroke-width="1.5"/>
        <text x="110" y="74" font-size="16" letter-spacing="10.6" fill="#d9b464">TOURS HUB</text></svg>
    </div>
  </div>
  <div class="photo"><svg class="logo" viewBox="0 0 300 90"><use href="#markA"/>
    <text x="80" y="52" font-size="42" font-weight="600" letter-spacing="5" fill="#fff">MOROCCO</text>
    <line x1="81" y1="68" x2="102" y2="68" stroke="#c0913b" stroke-width="1.5"/>
    <text x="110" y="74" font-size="16" letter-spacing="10.6" fill="#d9b464">TOURS HUB</text></svg></div>
</section>

<!-- ============ B: Khatim star ============ -->
<section class="opt">
  <h2>B · Moroccan 8-point star (khatim) with two dunes forming an M</h2>
  <div class="bar">
    <svg class="logo" viewBox="0 0 300 90" aria-label="Morocco Tours Hub">
      <g id="markB" transform="translate(0 3)">
        <g fill="#c0913b"><rect x="11" y="11" width="62" height="62"/><rect x="11" y="11" width="62" height="62" transform="rotate(45 42 42)"/></g>
        <g fill="#000"><rect x="14.5" y="14.5" width="55" height="55"/><rect x="14.5" y="14.5" width="55" height="55" transform="rotate(45 42 42)"/></g>
        <path d="M22 54 Q31 30 42 46 Q53 30 62 54" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="42" cy="27" r="3.6" fill="#c0913b"/>
      </g>
      <text x="96" y="50" font-size="40" font-weight="600" letter-spacing="4.5" fill="#fff">MOROCCO</text>
      <text x="97" y="73" font-size="15.5" font-weight="400" letter-spacing="12.3" fill="#d9b464">TOURS HUB</text>
    </svg>
    <nav class="menu"><span>Home</span><span>All Tours</span><span>Experiences</span></nav>
    <div class="small">phone size →
      <svg class="logo logo--s" viewBox="0 0 300 90"><use href="#markB"/>
        <text x="96" y="50" font-size="40" font-weight="600" letter-spacing="4.5" fill="#fff">MOROCCO</text>
        <text x="97" y="73" font-size="15.5" letter-spacing="12.3" fill="#d9b464">TOURS HUB</text></svg>
    </div>
  </div>
  <div class="photo"><svg class="logo" viewBox="0 0 300 90">
      <g transform="translate(0 3)">
        <g fill="#c0913b"><rect x="11" y="11" width="62" height="62"/><rect x="11" y="11" width="62" height="62" transform="rotate(45 42 42)"/></g>
        <g fill="#0a2033"><rect x="14.5" y="14.5" width="55" height="55"/><rect x="14.5" y="14.5" width="55" height="55" transform="rotate(45 42 42)"/></g>
        <path d="M22 54 Q31 30 42 46 Q53 30 62 54" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="42" cy="27" r="3.6" fill="#c0913b"/>
      </g>
      <text x="96" y="50" font-size="40" font-weight="600" letter-spacing="4.5" fill="#fff">MOROCCO</text>
      <text x="97" y="73" font-size="15.5" letter-spacing="12.3" fill="#d9b464">TOURS HUB</text></svg></div>
</section>

<!-- ============ C: Wordmark, the O is the sun ============ -->
<section class="opt">
  <h2>C · Wordmark only: the first O is a sun setting behind a dune</h2>
  <div class="bar">
    <svg class="logo wordC" viewBox="0 0 300 90" aria-label="Morocco Tours Hub"></svg>
    <nav class="menu"><span>Home</span><span>All Tours</span><span>Experiences</span></nav>
    <div class="small">phone size → <svg class="logo logo--s wordC" viewBox="0 0 300 90"></svg></div>
  </div>
  <div class="photo"><svg class="logo wordC" viewBox="0 0 300 90"></svg></div>
</section>

<script>
// Option C: place the sun-O between "M" and "ROCCO" once Oswald has loaded.
document.fonts.ready.then(() => {
  const NS = 'http://www.w3.org/2000/svg';
  document.querySelectorAll('.wordC').forEach((svg, i) => {
    const t = (x, s, txt, attrs) => { const e = document.createElementNS(NS, 'text');
      e.setAttribute('x', x); e.setAttribute('y', 58); e.setAttribute('font-size', s);
      for (const k in attrs) e.setAttribute(k, attrs[k]); e.textContent = txt; svg.appendChild(e); return e; };
    const m = t(4, 54, 'M', { 'font-weight': 600, fill: '#fff' });
    const mw = m.getBBox().width;
    const cap = 39;                 // Oswald cap height at 54px
    const rx = 12.2, ry = cap / 2 - 1.8, cx = 4 + mw + 5 + rx, cy = 58 - cap / 2;
    const id = 'clipC' + i;
    svg.insertAdjacentHTML('beforeend',
      `<defs><clipPath id="${id}"><ellipse cx="${cx}" cy="${cy}" rx="${rx - 2.6}" ry="${ry - 2.6}"/></clipPath></defs>
       <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#fff" stroke-width="5.4"/>
       <g clip-path="url(#${id})">
         <circle cx="${cx}" cy="${cy + 1}" r="5.6" fill="#d9b464"/>
         <path d="M${cx - 14} ${cy + 6} Q${cx - 4} ${cy - 1} ${cx + 3} ${cy + 5} T${cx + 14} ${cy + 3} V${cy + 20} H${cx - 14} Z" fill="#a5762a"/>
       </g>`);
    const r = t(cx + rx + 5, 54, 'ROCCO', { 'font-weight': 600, fill: '#fff', 'letter-spacing': 2.2 });
    const end = cx + rx + 5 + r.getBBox().width - 2.2;
    const hub = t(5, 18, 'TOURS HUB', { fill: '#d9b464', 'letter-spacing': 6 });
    hub.setAttribute('y', 82);
    const hw = hub.getBBox().width - 6;
    svg.insertAdjacentHTML('beforeend',
      `<line x1="${5 + hw + 10}" y1="76.5" x2="${end}" y2="76.5" stroke="#c0913b" stroke-width="1.4"/>`);
  });
});
</script>
</body>
</html>
