<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo ideas 3</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#000; color:#fff; font-family:Poppins, sans-serif; }
  .opt { padding:24px 56px 32px; border-bottom:1px solid #222; }
  .opt h2 { font: 500 14px Poppins; color:#9aa4ad; margin:0 0 16px; }
  .row { display:flex; align-items:center; gap:40px; flex-wrap:wrap; }
  .bar { display:flex; align-items:center; gap:44px; height:116px; padding:0 32px; border:1px solid #1d1d1d; border-radius:6px; }
  .photo { height:116px; margin-top:12px; border-radius:6px; padding:0 32px; display:flex; align-items:center;
           background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.2)), url(/assets/images/erg-chebbi-caravan-sunset.jpg) center 40%/cover; }
  .menu { display:flex; gap:26px; font: 500 15px Oswald; text-transform:uppercase; }
  svg text { font-family: Oswald, sans-serif; }
  svg .tag { font-family: Poppins, sans-serif; }
  .big { height:230px; } .logo { height:72px; } .s { height:44px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c57a"/><stop offset=".55" stop-color="#c0913b"/><stop offset="1" stop-color="#a5762a"/>
    </linearGradient>

    <!-- camel with rider, facing right, feet at y=50 -->
    <symbol id="camelR" viewBox="0 -12 60 62">
      <path d="M8 16 C12 9 17 6 22 6 C27 6 30 10 32 14 C34 17 37 21 40 22 C42 20 44 15 46.5 12.2 C48 10.8 50.5 10.6 53 11.6 L55.2 12.8 C55.9 13.4 55.8 15.2 55 15.6 L51 16.2 C48.5 18 46 22.5 43 26.5 C41.5 28 39 28.5 36.5 28.3 L38 38 L39.6 47.8 L41.6 49.4 L41.4 50 L38.3 50 L36.8 39 L34.6 30.6 L33.5 30.6 L32 39.5 L30 50 L28.3 50 L30.4 39.5 L31.2 30.2 C26 30.8 20 30.6 16 29.6 L17.6 39 L19.6 50 L17.6 50 L15.9 40 L13.8 31.2 L12.8 31 L9.4 38.2 L10.6 50 L8.8 50 L7.4 38.6 C7 33 7 28 7.4 24 C6.8 21 7 18 8 16 Z"/>
      <path d="M8 18 Q6.6 23 6.5 30" stroke-width="1" stroke-linecap="round" fill="none" style="stroke:inherit"/>
      <circle cx="22.6" cy="-6.2" r="2.7"/>
      <path d="M19.2 6 C19 1.5 20.2 -2.6 22.6 -3 C25 -2.6 26 1 26.2 5 L28.6 13.6 L26.8 14.2 L24.2 8 L19.2 8 Z"/>
    </symbol>
    <symbol id="camel" viewBox="0 -12 60 62"><path d="M8 16 C12 9 17 6 22 6 C27 6 30 10 32 14 C34 17 37 21 40 22 C42 20 44 15 46.5 12.2 C48 10.8 50.5 10.6 53 11.6 L55.2 12.8 C55.9 13.4 55.8 15.2 55 15.6 L51 16.2 C48.5 18 46 22.5 43 26.5 C41.5 28 39 28.5 36.5 28.3 L38 38 L39.6 47.8 L41.6 49.4 L41.4 50 L38.3 50 L36.8 39 L34.6 30.6 L33.5 30.6 L32 39.5 L30 50 L28.3 50 L30.4 39.5 L31.2 30.2 C26 30.8 20 30.6 16 29.6 L17.6 39 L19.6 50 L17.6 50 L15.9 40 L13.8 31.2 L12.8 31 L9.4 38.2 L10.6 50 L8.8 50 L7.4 38.6 C7 33 7 28 7.4 24 C6.8 21 7 18 8 16 Z"/>
      <path d="M8 18 Q6.6 23 6.5 30" stroke-width="1" stroke-linecap="round" fill="none" style="stroke:inherit"/></symbol>
    <!-- guide on foot (turban, djellaba), arm back holding the rope -->
    <symbol id="guide" viewBox="0 0 16 40">
      <circle cx="9" cy="4.4" r="3.3"/>
      <path d="M6.8 8 L11.2 8 C12.6 9 13 11 13 13 L13.6 24 L14.4 33 L15.2 38.6 L12.6 39 L11.3 33.5 L9.8 39 L5 39 L5.8 33 L5.2 24 L5.6 14 L3.4 18.6 L2.2 18.2 L4.2 12 C4.8 9.6 5.6 8.6 6.8 8 Z"/>
    </symbol>
    <!-- date palm -->
    <symbol id="palm" viewBox="0 0 30 50">
      <path d="M14 50 C14.6 38 15.6 26 17 14 L18.8 14 C17.6 26 16.8 38 16.6 50 Z"/>
      <path d="M17.8 13 C12 8 6 9 1.5 15 C7 11.5 12 12 17.8 14.4 Z"/>
      <path d="M17.8 13 C23 7.5 28 8.5 29.5 15 C25.5 11.5 21.5 11.8 17.8 14.4 Z"/>
      <path d="M17.8 13 C14 6 9 3.5 3.5 4.5 C9 5.5 13 8.5 17.4 13.8 Z"/>
      <path d="M17.8 13 C21 5.5 25 3 29 4 C25 5.5 21.5 8.5 18.2 13.8 Z"/>
      <path d="M17.8 13 C17 7 18 3 20.5 0.3 C19.6 4 19.4 8 18.6 13 Z"/>
    </symbol>

    <!-- F: rising half-sun, caravan on the horizon line -->
    <clipPath id="halfSun"><rect x="0" y="0" width="130" height="72"/></clipPath>
    <g id="markF">
      <circle cx="62" cy="72" r="52" fill="url(#sun)" clip-path="url(#halfSun)"/>
      <g fill="#000" stroke="#000">
        <use href="#camelR" x="19" y="40.5" width="30" height="31"/>
        <use href="#camelR" x="45" y="40.5" width="30" height="31"/>
        <path d="M72.5 47.3 Q76.5 54 79.3 52" fill="none" stroke-width=".6"/>
        <use href="#guide" x="78" y="52" width="8" height="20"/>
      </g>
      <path d="M2 72.5 H122" stroke="#c0913b" stroke-width="2"/>
    </g>

    <!-- G: full sun setting behind a dune, palm + rider + guide -->
    <clipPath id="fullSun"><circle cx="50" cy="50" r="42"/></clipPath>
    <g id="markG">
      <circle cx="50" cy="50" r="47" fill="none" stroke="#c0913b" stroke-width="1.4"/>
      <circle cx="50" cy="50" r="42" fill="url(#sun)"/>
      <g clip-path="url(#fullSun)" fill="#000" stroke="#000">
        <path d="M0 74 Q28 65 52 70.5 T100 66 V100 H0 Z"/>
        <use href="#palm" x="10" y="40" width="19" height="31.7"/>
        <use href="#camelR" x="29" y="36" width="34" height="35"/>
        <path d="M60.5 51 Q63.6 57.4 67.4 58.6" fill="none" stroke-width=".55"/>
        <use href="#guide" x="66" y="48.5" width="9" height="22.5"/>
      </g>
    </g>
    <g id="markG2">
      <circle cx="50" cy="50" r="47" fill="none" stroke="#c0913b" stroke-width="1.4"/>
      <circle cx="50" cy="50" r="42" fill="url(#sun)"/>
      <g clip-path="url(#fullSun)" fill="#000" stroke="#000">
        <path d="M0 74 Q28 65 52 70.5 T100 66 V100 H0 Z"/>
        <use href="#palm" x="8" y="45" width="15" height="25"/>
        <use href="#camel"  x="18" y="45.9" width="24" height="24.8"/>
        <use href="#camelR" x="41" y="45.7" width="24" height="24.8"/>
        <path d="M63.2 56.3 Q65.4 59.6 67.8 59.5" fill="none" stroke-width=".5"/>
        <use href="#guide" x="66.5" y="49.5" width="8.5" height="21.25"/>
      </g>
    </g>
  </defs>
</svg>

<section class="opt">
  <h2>G1 · One camel with its rider, led by the guide</h2>
  <div class="row">
    <svg class="big" viewBox="0 0 100 100"><use href="#markG"/></svg>
    <div>
      <div class="bar">
        <svg class="logo" viewBox="0 0 360 100"><use href="#markG"/>
          <text x="114" y="52" font-size="42" font-weight="600" letter-spacing="7" fill="#fff">MOROCCO</text>
          <text x="115" y="76" font-size="16" letter-spacing="12.2" fill="#d9b464">TOURS HUB</text>
          <text class="tag" x="115" y="94" font-size="8" letter-spacing="2.9" fill="#cfd3d6">YOUR JOURNEY, OUR PASSION</text></svg>
        <nav class="menu"><span>Home</span><span>All Tours</span><span>Experiences</span></nav>
        <svg class="s" viewBox="0 0 360 100"><use href="#markG"/>
          <text x="114" y="52" font-size="42" font-weight="600" letter-spacing="7" fill="#fff">MOROCCO</text>
          <text x="115" y="76" font-size="16" letter-spacing="12.2" fill="#d9b464">TOURS HUB</text></svg>
      </div>
      <div class="photo"><svg class="logo" viewBox="0 0 360 100"><use href="#markG"/>
          <text x="114" y="52" font-size="42" font-weight="600" letter-spacing="7" fill="#fff">MOROCCO</text>
          <text x="115" y="76" font-size="16" letter-spacing="12.2" fill="#d9b464">TOURS HUB</text>
          <text class="tag" x="115" y="94" font-size="8" letter-spacing="2.9" fill="#cfd3d6">YOUR JOURNEY, OUR PASSION</text></svg></div>
    </div>
  </div>
</section>

<section class="opt">
  <h2>G2 · Same, with two camels (one with a rider) led by the guide</h2>
  <div class="row">
    <svg class="big" viewBox="0 0 100 100"><use href="#markG2"/></svg>
    <div>
      <div class="bar">
        <svg class="logo" viewBox="0 0 360 100"><use href="#markG2"/>
          <text x="114" y="52" font-size="42" font-weight="600" letter-spacing="7" fill="#fff">MOROCCO</text>
          <text x="115" y="76" font-size="16" letter-spacing="12.2" fill="#d9b464">TOURS HUB</text>
          <text class="tag" x="115" y="94" font-size="8" letter-spacing="2.9" fill="#cfd3d6">YOUR JOURNEY, OUR PASSION</text></svg>
        <nav class="menu"><span>Home</span><span>All Tours</span><span>Experiences</span></nav>
        <svg class="s" viewBox="0 0 360 100"><use href="#markG2"/>
          <text x="114" y="52" font-size="42" font-weight="600" letter-spacing="7" fill="#fff">MOROCCO</text>
          <text x="115" y="76" font-size="16" letter-spacing="12.2" fill="#d9b464">TOURS HUB</text></svg>
      </div>
      <div class="photo"><svg class="logo" viewBox="0 0 360 100"><use href="#markG2"/>
          <text x="114" y="52" font-size="42" font-weight="600" letter-spacing="7" fill="#fff">MOROCCO</text>
          <text x="115" y="76" font-size="16" letter-spacing="12.2" fill="#d9b464">TOURS HUB</text>
          <text class="tag" x="115" y="94" font-size="8" letter-spacing="2.9" fill="#cfd3d6">YOUR JOURNEY, OUR PASSION</text></svg></div>
    </div>
  </div>
</section>
</body>
</html>
